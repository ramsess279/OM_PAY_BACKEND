openapi: 3.0.3
info:
  title: OM Pay API - Authentification
  description: Endpoints d'authentification pour l'API OM Pay
  version: 1.0.0
servers:
  - url: https://om-pay-rama.onrender.com/api
    description: Serveur de production
  - url: http://localhost:8000/api
    description: Serveur de développement

paths:
  /register:
    post:
      summary: Inscription d'un nouvel utilisateur
      description: Inscription d'un nouvel utilisateur avec envoi automatique d'email de confirmation contenant les identifiants de connexion
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nom
                - prenom
                - telephone
                - email
                - code_pin
              properties:
                nom:
                  type: string
                  example: "Fatou"
                prenom:
                  type: string
                  example: "Fall"
                telephone:
                  type: string
                  example: "771234567"
                email:
                  type: string
                  format: email
                  example: "fatou.fall@gmail.com"
                code_pin:
                  type: string
                  example: "1234"
      responses:
        '201':
          description: Utilisateur créé avec succès - Compte inactif, activation requise via email
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Utilisateur créé avec succès. Veuillez consulter votre email pour activer votre compte."
              example:
                success: true
                message: "Utilisateur créé avec succès. Veuillez consulter votre email pour activer votre compte."
        '422':
          description: Erreur de validation

  /login:
    post:
      summary: Connexion d'un utilisateur
      description: Connexion à un compte actif avec téléphone et code PIN
      tags:
        - Authentification   
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - telephone
                - code_pin
              properties:
                telephone:
                  type: string
                  example: "771234567"
                code_pin:
                  type: string
                  example: "1234"
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Connexion réussie"
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..."
                      refresh_token:
                        type: string
                        example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..."
                      token_type:
                        type: string
                        example: "Bearer"
                      expires_in:
                        type: integer
                        example: 3600
                      expires_at:
                        type: string
                        format: date-time
                        example: "2025-11-10T09:47:17.442309Z"
                      refresh_expires_at:
                        type: string
                        format: date-time
                        example: "2025-12-10T08:47:17.442409Z"
        '401':
          description: Téléphone ou code PIN invalide

  /activate:
    post:
      summary: Activer un compte utilisateur
      description: Activer un compte inactif avec le code OTP reçu par email
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - telephone
                - code_pin
                - code_otp
              properties:
                telephone:
                  type: string
                  example: "771234567"
                code_pin:
                  type: string
                  example: "1234"
                code_otp:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Compte activé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Compte activé avec succès. Vous pouvez maintenant vous connecter."
        '401':
          description: Téléphone, code PIN ou code OTP invalide

securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT